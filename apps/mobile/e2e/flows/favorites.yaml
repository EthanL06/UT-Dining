appId: com.ethanl06.ut-dining.dev
name: Favorites can be added from a food or a hold and removed with a hold
---
- runFlow: ../subflows/start.yaml
- runFlow: ../subflows/open-j2.yaml
- scrollUntilVisible:
    element: 'Maestro Veggie Burger(,.*)?'
    direction: DOWN
    visibilityPercentage: 100
- tapOn: 'Maestro Veggie Burger(,.*)?'
- extendedWaitUntil:
    visible:
      id: food-favorite-button
    timeout: 10000
- tapOn:
    id: food-favorite-button
- repeat:
    while:
      visible:
        id: food-favorite-button
    times: 3
    commands:
      - tapOn:
          id: back-button
      - waitForAnimationToEnd
- longPressOn: 'Maestro Grilled Chicken(,.*)?'
- extendedWaitUntil:
    visible: Add to Favorites
    timeout: 5000
- tapOn: Add to Favorites
- waitForAnimationToEnd
- tapOn:
    id: BackButton
- scrollUntilVisible:
    element:
      id: home-favorites-button
    direction: UP
- repeat:
    while:
      notVisible:
        id: favorites-screen
    times: 3
    commands:
      - tapOn:
          id: home-favorites-button
      - waitForAnimationToEnd
- assertVisible:
    id: favorites-screen
- assertVisible: 'Maestro Veggie Burger(,.*)?'
- assertVisible: 'Maestro Grilled Chicken(,.*)?'
- takeScreenshot: favorites
- longPressOn: 'Maestro Veggie Burger(,.*)?'
- extendedWaitUntil:
    visible: Remove from Favorites
    timeout: 5000
- tapOn: Remove from Favorites
- extendedWaitUntil:
    notVisible: 'Maestro Veggie Burger(,.*)?'
    timeout: 5000
- longPressOn: 'Maestro Grilled Chicken(,.*)?'
- extendedWaitUntil:
    visible: Remove from Favorites
    timeout: 5000
- tapOn: Remove from Favorites
- extendedWaitUntil:
    visible: No Favorites Yet!
    timeout: 5000
