appId: com.ethanl06.ut-dining.dev
name: A food item opens its nutrition details
---
- runFlow: ../subflows/start.yaml
- runFlow: ../subflows/open-j2.yaml
- scrollUntilVisible:
    element: 'Maestro Veggie Burger(,.*)?'
    direction: DOWN
    visibilityPercentage: 100
- tapOn: 'Maestro Veggie Burger(,.*)?'
- extendedWaitUntil:
    visible: Nutrition Facts
    timeout: 10000
- assertVisible: Calories.*
- assertVisible: '410'
- assertVisible: 21g
- assertVisible: 38g
- assertVisible:
    id: food-favorite-button
- assertVisible:
    id: food-meal-plan-button
- takeScreenshot: food-details
- tapOn:
    id: back-button
- extendedWaitUntil:
    visible: 'Maestro Grill(,.*)?'
    timeout: 5000
