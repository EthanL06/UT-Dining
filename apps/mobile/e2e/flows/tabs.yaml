appId: com.ethanl06.ut-dining.dev
name: Every tab opens
---
- runFlow: ../subflows/start.yaml
- tapOn:
    id: map-tab
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: map
- tapOn:
    id: notifications-tab
- extendedWaitUntil:
    visible: '.*Maintenance Underway.*'
    timeout: 5000
- assertVisible: Today|Yesterday|Earlier
- takeScreenshot: notifications
- tapOn:
    id: settings-tab
- extendedWaitUntil:
    visible:
      id: settings-dark-mode-switch
    timeout: 5000
- tapOn:
    id: home-tab
- extendedWaitUntil:
    visible: '(Breakfast|Lunch|Dinner) is served.*'
    timeout: 5000
- assertVisible: Open now|Closed
- tapOn:
    id: search-tab
- extendedWaitUntil:
    visible: "Search today's menus"
    timeout: 5000
