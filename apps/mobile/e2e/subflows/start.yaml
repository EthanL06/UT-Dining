appId: com.ethanl06.ut-dining.dev
env:
  DEV_CLIENT: ${DEV_CLIENT || 'true'}
  METRO_URL: ${METRO_URL || 'http://localhost:8081'}
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow:
    when:
      true: ${DEV_CLIENT == 'true'}
    commands:
      - openLink: exp+ut-dining://expo-development-client/?url=${encodeURIComponent(METRO_URL)}&disableOnboarding=1
- openLink: ut-dining://e2e-setup
- extendedWaitUntil:
    visible: Open in .*
    timeout: 10000
    optional: true
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: '(Breakfast|Lunch|Dinner) is served.*|.*Would Like to Send You Notifications.*|.*to use your location.*|Enjoying.*'
    timeout: 60000
- runFlow:
    when:
      notVisible: '(Breakfast|Lunch|Dinner) is served.*'
    commands:
      - runFlow: dismiss-alerts.yaml
- extendedWaitUntil:
    visible: '(Breakfast|Lunch|Dinner) is served.*'
    timeout: 30000
