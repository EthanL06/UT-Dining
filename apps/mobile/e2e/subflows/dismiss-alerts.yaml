appId: com.ethanl06.ut-dining.dev
---
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    while:
      visible: '.*Would Like to Send You Notifications.*|.*to use your location.*|Enjoying.*|Open in .*'
    times: 4
    commands:
      - runFlow:
          when:
            visible: .*Would Like to Send You Notifications.*
          commands:
            - tapOn:
                text: Allow
                optional: true
      - runFlow:
          when:
            visible: .*to use your location.*
          commands:
            - tapOn:
                text: Allow While Using App
                optional: true
      - runFlow:
          when:
            visible: Enjoying.*
          commands:
            - tapOn:
                text: Not Now
                optional: true
      - runFlow:
          when:
            visible: Open in .*
          commands:
            - tapOn:
                text: Open
                optional: true
      - waitForAnimationToEnd:
          timeout: 2000
