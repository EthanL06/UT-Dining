appId: com.ethanl06.ut-dining.dev
---
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: Must use physical device for push notifications.
          commands:
            - tapOn:
                text: OK
                optional: true
      - runFlow:
          when:
            visible: .*Would Like to Send You Notifications.*
          commands:
            - tapOn:
                text: Allow
                optional: true
      - waitForAnimationToEnd:
          timeout: 2000
