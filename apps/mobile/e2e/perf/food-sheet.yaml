appId: com.ethanl06.ut-dining.dev
---
- repeat:
    times: 3
    commands:
      - tapOn:
          text: '.*kcal.*'
          index: 1
      - extendedWaitUntil:
          visible: 'Calories.*'
          timeout: 5000
      - swipe:
          start: 50%, 12%
          end: 50%, 95%
          duration: 300
      - extendedWaitUntil:
          notVisible: 'Calories.*'
          timeout: 5000
