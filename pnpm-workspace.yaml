packages:
  - apps/*
  - packages/*

# Versions shared by more than one workspace package. Reference them with "catalog:".
catalog:
  '@supabase/supabase-js': ^2.49.1
  '@types/node': ^24.0.0
  typescript: ^6.0.3

# Packages allowed to run install scripts (pnpm 10 blocks them by default).
onlyBuiltDependencies:
  - lefthook

overrides:
  esbuild: ^0.25.6
  # The TanStack dev tools plugin pins SDK 52 native modules; use the app's versions instead.
  tanstack-query-dev-tools-expo-plugin>@expo/metro-runtime: ~58.0.15
  tanstack-query-dev-tools-expo-plugin>expo-device: ~58.0.5

