pre-commit:
  commands:
    biome:
      glob: '*.{js,jsx,ts,tsx,json,jsonc,css}'
      run: pnpm biome check --write --diagnostic-level=error --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    no-comments:
      run: scripts/dev/check-comments.sh --staged

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
