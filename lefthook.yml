pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css,yml,yaml}'
      run: pnpm exec biome check --write --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    no-comments:
      run: scripts/dev/check-comments.sh --staged
    staged-files:
      run: scripts/dev/check-staged.sh

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    checks:
      run: scripts/dev/pre-push.sh
      use_stdin: true
