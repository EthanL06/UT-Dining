name: iOS simulator app
description: Builds the release simulator app of the development bundle id into .context/app. A cache hit on the app sources skips everything; otherwise the native build is reused by a hash of its inputs and only the JavaScript is rebuilt with a cached Metro transform cache, and a full Xcode build runs only when native code changed.

outputs:
  key:
    description: Cache key of the built app in .context/app
    value: ${{ steps.app-cache.outputs.cache-primary-key }}
  cached:
    description: true when the app was found in the cache, so .context/app is still empty and has to be restored
    value: ${{ steps.app-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Look up the built app
      id: app-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .context/app
        key: ios-release-app-${{ hashFiles('apps/mobile/**', '!apps/mobile/e2e/**', 'packages/core/**', 'pnpm-lock.yaml', 'scripts/qa/ios-sim-app.sh') }}
        lookup-only: true

    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      if: steps.app-cache.outputs.cache-hit != 'true'

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      if: steps.app-cache.outputs.cache-hit != 'true'
      with:
        node-version-file: .node-version
        cache: pnpm

    - if: steps.app-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Compute the native key
      id: native
      if: steps.app-cache.outputs.cache-hit != 'true'
      shell: bash
      run: echo "key=ios-sim-shell-$(scripts/qa/ios-sim-app.sh --key)" >> "$GITHUB_OUTPUT"

    - name: Restore the native build
      id: shell
      if: steps.app-cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .context/ios-shell
        key: ${{ steps.native.outputs.key }}

    - name: Restore the Metro cache
      id: metro
      if: steps.app-cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .context/metro-cache
        key: ios-metro-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/babel.config.*', 'apps/mobile/metro.config.cjs', 'apps/mobile/babel-plugin-*') }}-${{ github.sha }}
        restore-keys: |
          ios-metro-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/babel.config.*', 'apps/mobile/metro.config.cjs', 'apps/mobile/babel-plugin-*') }}-

    - name: Install ccache
      if: steps.app-cache.outputs.cache-hit != 'true' && steps.shell.outputs.cache-hit != 'true'
      shell: bash
      run: |
        command -v ccache >/dev/null || brew install ccache
        echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=3G" >> "$GITHUB_ENV"
        echo "USE_CCACHE=1" >> "$GITHUB_ENV"

    - name: Restore ccache
      id: ccache
      if: steps.app-cache.outputs.cache-hit != 'true' && steps.shell.outputs.cache-hit != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.ccache
        key: ios-ccache-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          ios-ccache-${{ hashFiles('pnpm-lock.yaml') }}-
          ios-ccache-

    - name: Restore CocoaPods
      if: steps.app-cache.outputs.cache-hit != 'true' && steps.shell.outputs.cache-hit != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/Library/Caches/CocoaPods
        key: ios-pods-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: ios-pods-

    - name: Build the app
      if: steps.app-cache.outputs.cache-hit != 'true'
      shell: bash
      run: scripts/qa/ios-sim-app.sh --out .context/app

    - name: Save the native build
      if: steps.app-cache.outputs.cache-hit != 'true' && steps.shell.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .context/ios-shell
        key: ${{ steps.native.outputs.key }}

    - name: Save the Metro cache
      if: steps.app-cache.outputs.cache-hit != 'true' && steps.metro.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .context/metro-cache
        key: ${{ steps.metro.outputs.cache-primary-key }}

    - name: Save the built app
      if: steps.app-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .context/app
        key: ${{ steps.app-cache.outputs.cache-primary-key }}

    - name: Save ccache
      if: always() && steps.ccache.outcome == 'success'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.ccache
        key: ${{ steps.ccache.outputs.cache-primary-key }}

    - name: Upload the build log
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ios-build-log
        path: apps/mobile/ios/build.log
        if-no-files-found: ignore
