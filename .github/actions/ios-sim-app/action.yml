name: iOS simulator app
description: Builds the release simulator app of the development bundle id into .context/app. A cache hit on the app sources skips everything; otherwise the native build is reused by its Expo fingerprint and only the JavaScript is rebuilt, and a full Xcode build runs only when native code changed.

outputs:
  key:
    description: Cache key of the built app in .context/app
    value: ${{ steps.app-cache.outputs.cache-primary-key }}
  cached:
    description: true when the app was found in the cache, so .context/app is still empty and has to be restored
    value: ${{ steps.app-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Look up the built app
      id: app-cache
      uses: actions/cache/restore@v6
      with:
        path: .context/app
        key: ios-release-app-${{ hashFiles('apps/mobile/**', '!apps/mobile/e2e/**', 'packages/core/**', 'pnpm-lock.yaml', 'scripts/qa/ios-sim-app.sh') }}
        lookup-only: true

    - uses: pnpm/action-setup@v6
      if: steps.app-cache.outputs.cache-hit != 'true'

    - uses: actions/setup-node@v7
      if: steps.app-cache.outputs.cache-hit != 'true'
      with:
        node-version-file: .node-version
        cache: pnpm

    - if: steps.app-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Compute the native key
      id: native
      if: steps.app-cache.outputs.cache-hit != 'true'
      shell: bash
      run: echo "key=ios-sim-shell-$(scripts/qa/ios-sim-app.sh --key)" >> "$GITHUB_OUTPUT"

    - name: Restore the native build
      id: shell
      if: steps.app-cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6
      with:
        path: .context/ios-shell
        key: ${{ steps.native.outputs.key }}

    - name: Install ccache
      if: steps.app-cache.outputs.cache-hit != 'true' && steps.shell.outputs.cache-hit != 'true'
      shell: bash
      run: |
        command -v ccache >/dev/null || brew install ccache
        echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=3G" >> "$GITHUB_ENV"
        echo "USE_CCACHE=1" >> "$GITHUB_ENV"

    - name: Restore ccache
      id: ccache
      if: steps.app-cache.outputs.cache-hit != 'true' && steps.shell.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/.ccache
        key: ios-ccache-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          ios-ccache-${{ hashFiles('pnpm-lock.yaml') }}-
          ios-ccache-

    - name: Restore CocoaPods
      if: steps.app-cache.outputs.cache-hit != 'true' && steps.shell.outputs.cache-hit != 'true'
      uses: actions/cache@v6
      with:
        path: ~/Library/Caches/CocoaPods
        key: ios-pods-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: ios-pods-

    - name: Build the app
      if: steps.app-cache.outputs.cache-hit != 'true'
      shell: bash
      run: scripts/qa/ios-sim-app.sh --out .context/app

    - name: Save the native build
      if: steps.app-cache.outputs.cache-hit != 'true' && steps.shell.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .context/ios-shell
        key: ${{ steps.native.outputs.key }}

    - name: Save the built app
      if: steps.app-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .context/app
        key: ${{ steps.app-cache.outputs.cache-primary-key }}

    - name: Save ccache
      if: always() && steps.ccache.outcome == 'success'
      uses: actions/cache/save@v6
      with:
        path: ~/.ccache
        key: ${{ steps.ccache.outputs.cache-primary-key }}

    - name: Upload the build log
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ios-build-log
        path: apps/mobile/ios/build.log
        if-no-files-found: ignore
