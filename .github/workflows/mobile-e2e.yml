name: Mobile E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the iOS app
    if: github.event_name != 'pull_request' || github.head_ref == 'staging'
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      key: ${{ steps.app-cache.outputs.cache-primary-key }}
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
      EXPO_PUBLIC_SUPABASE_ANON_KEY: fixture
    steps:
      - uses: actions/checkout@v7

      - name: Look up the built app
        id: app-cache
        uses: actions/cache/restore@v6
        with:
          path: .context/app
          key: ios-release-app-${{ hashFiles('apps/mobile/**', '!apps/mobile/e2e/**', 'packages/core/**', 'pnpm-lock.yaml') }}
          lookup-only: true

      - uses: pnpm/action-setup@v6
        if: steps.app-cache.outputs.cache-hit != 'true'

      - uses: actions/setup-node@v7
        if: steps.app-cache.outputs.cache-hit != 'true'
        with:
          node-version-file: .node-version
          cache: pnpm

      - if: steps.app-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate the iOS project
        if: steps.app-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios

      - name: Build a release simulator app
        if: steps.app-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE="$(ls -d *.xcworkspace | head -1)"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "${WORKSPACE%.xcworkspace}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1 || {
              grep -nE "error:|Error:|@build-script-error|BUILD FAILED" -A8 build.log | head -150
              exit 1
            }
          tail -5 build.log
          mkdir -p ../../../.context/app
          cp -R build/Build/Products/Release-iphonesimulator/*.app ../../../.context/app/

      - name: Save the built app
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .context/app
          key: ${{ steps.app-cache.outputs.cache-primary-key }}

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-log
          path: apps/mobile/ios/build.log
          if-no-files-found: ignore

  e2e:
    name: Maestro shard ${{ matrix.shard }}
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000
      MAESTRO_VERSION: 2.12.1
      SHARD_1_FLOWS: onboarding food-details
      SHARD_2_FLOWS: favorites tabs settings
    steps:
      - uses: actions/checkout@v7

      - name: Create and boot a simulator
        run: |
          RUNTIME_JSON="$(xcrun simctl list runtimes -j | jq '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | last')"
          RUNTIME="$(jq -r '.identifier' <<<"$RUNTIME_JSON")"
          DEVICE_TYPE="$(jq -r '[.supportedDeviceTypes[] | select(.name | test("^iPhone [0-9]+$"))] | sort_by(.name | ltrimstr("iPhone ") | tonumber) | last | .identifier' <<<"$RUNTIME_JSON")"
          echo "Runtime $RUNTIME, device type $DEVICE_TYPE"
          SIM="$(xcrun simctl create maestro "$DEVICE_TYPE" "$RUNTIME")"
          xcrun simctl boot "$SIM"
          echo "SIM=$SIM" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore Maestro
        id: maestro-cache
        uses: actions/cache@v6
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-${{ runner.arch }}-${{ env.MAESTRO_VERSION }}

      - name: Install Maestro
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://get.maestro.mobile.dev | bash

      - run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Restore the built app
        uses: actions/cache/restore@v6
        with:
          path: .context/app
          key: ${{ needs.build.outputs.key }}
          fail-on-cache-miss: true

      - name: Install the app once the simulator has booted
        run: |
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl install "$SIM" .context/app/*.app

      - name: Pick this shard's flows
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            1) NAMES="$SHARD_1_FLOWS" ;;
            2) NAMES="$SHARD_2_FLOWS" ;;
            *) NAMES="$(ls apps/mobile/e2e/flows/*.yaml | xargs -n1 basename | sed 's/\.yaml$//' | grep -vxF -f <(tr ' ' '\n' <<<"$SHARD_1_FLOWS $SHARD_2_FLOWS") | tr '\n' ' ')" ;;
          esac
          FLOWS=""
          for name in $NAMES; do
            [[ -f "apps/mobile/e2e/flows/$name.yaml" ]] || { echo "::error::No flow named $name"; exit 1; }
            FLOWS="$FLOWS apps/mobile/e2e/flows/$name.yaml"
          done
          echo "Flows:$FLOWS"
          echo "FLOWS=$FLOWS" >> "$GITHUB_ENV"

      - name: Run Maestro flows
        run: ./scripts/qa/mobile-e2e.sh --sim "$SIM" --release --fixture-server --retry-failed $FLOWS

      - name: Upload Maestro output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-${{ matrix.shard }}
          path: .context/maestro
          if-no-files-found: ignore

  ios:
    name: Maestro on iOS
    needs: [build, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "build=$BUILD e2e=$E2E"
          if [[ "$BUILD" == skipped ]]; then exit 0; fi
          [[ "$BUILD" == success && "$E2E" == success ]]
