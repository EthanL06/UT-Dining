name: Mobile E2E

on:
  pull_request:
    paths:
      - apps/mobile/**
      - packages/core/**
      - scripts/qa/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/mobile-e2e.yml
  push:
    branches: [staging, claude/project-thread-xehbd4]
    paths:
      - apps/mobile/**
      - packages/core/**
      - scripts/qa/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/mobile-e2e.yml
  workflow_dispatch:

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Maestro on iOS
    runs-on: macos-26
    timeout-minutes: 120
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
      EXPO_PUBLIC_SUPABASE_ANON_KEY: fixture
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore the built app
        id: app-cache
        uses: actions/cache/restore@v6
        with:
          path: .context/app
          key: ios-release-app-${{ hashFiles('apps/mobile/**', '!apps/mobile/e2e/**', 'packages/core/**', 'pnpm-lock.yaml') }}

      - name: Generate the iOS project
        if: steps.app-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios

      - name: Build a release simulator app
        if: steps.app-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE="$(ls -d *.xcworkspace | head -1)"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "${WORKSPACE%.xcworkspace}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1 || {
              grep -nE "error:|Error:|@build-script-error|BUILD FAILED" -A8 build.log | head -150
              exit 1
            }
          tail -5 build.log
          mkdir -p ../../../.context/app
          cp -R build/Build/Products/Release-iphonesimulator/*.app ../../../.context/app/

      - name: Save the built app
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .context/app
          key: ${{ steps.app-cache.outputs.cache-primary-key }}

      - name: Create a simulator and install the app
        run: |
          RUNTIME_JSON="$(xcrun simctl list runtimes -j | jq '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | last')"
          RUNTIME="$(jq -r '.identifier' <<<"$RUNTIME_JSON")"
          DEVICE_TYPE="$(jq -r '[.supportedDeviceTypes[] | select(.name | test("^iPhone [0-9]+$"))] | sort_by(.name | ltrimstr("iPhone ") | tonumber) | last | .identifier' <<<"$RUNTIME_JSON")"
          echo "Runtime $RUNTIME, device type $DEVICE_TYPE"
          SIM="$(xcrun simctl create maestro "$DEVICE_TYPE" "$RUNTIME")"
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl install "$SIM" .context/app/*.app
          echo "SIM=$SIM" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows
        run: ./scripts/qa/mobile-e2e.sh --sim "$SIM" --release --fixture-server

      - name: Upload Maestro output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios
          path: |
            .context/maestro
            apps/mobile/ios/build.log
          if-no-files-found: ignore
