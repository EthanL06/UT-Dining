name: Keep dev Supabase awake

on:
  schedule:
    - cron: '17 12 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Query ut-dining-dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row
        env:
          SUPABASE_DEV_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_DEV_SERVICE_KEY: ${{ secrets.SUPABASE_DEV_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_DEV_URL" ] || [ -z "$SUPABASE_DEV_SERVICE_KEY" ]; then
            echo "::error::Add the SUPABASE_DEV_URL and SUPABASE_DEV_SERVICE_KEY repository secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 --retry-all-errors \
            -H "apikey: $SUPABASE_DEV_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_DEV_SERVICE_KEY" \
            "$SUPABASE_DEV_URL/rest/v1/location_type?select=id&limit=1" > /dev/null
          echo "ut-dining-dev answered"

  keepalive:
    name: Keep schedule enabled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/dev-supabase-keepalive.yml/enable"
