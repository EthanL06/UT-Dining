name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - apps/website/**
      - pnpm-lock.yaml
      - .github/workflows/website-deploy.yml
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build --filter=@ut-dining/website
        env:
          WEBSITE_STATIC_EXPORT: '1'
          WEBSITE_SITE_URL: https://longhorn-developers.github.io
          WEBSITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          WEBSITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Publish to Longhorn-Developers/ut-dining-website gh-pages
        if: ${{ env.HAS_DEPLOY_KEY == 'true' }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          deploy_key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          external_repository: Longhorn-Developers/ut-dining-website
          publish_branch: gh-pages
          publish_dir: apps/website/out
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: 'deploy: website from ${{ github.repository }}@${{ github.sha }}'

      - name: Deploy skipped
        if: ${{ env.HAS_DEPLOY_KEY != 'true' }}
        run: echo "::notice::WEBSITE_DEPLOY_KEY is not set, so the site was built but not published."
