name: Database

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [staging]

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Migration safety and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check migrations and generated types
        run: scripts/dev/db-check.sh
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FORCE: ${{ github.event_name == 'push' && '1' || '' }}
          ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-migration') && '1' || '' }}
