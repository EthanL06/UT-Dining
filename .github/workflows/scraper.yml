name: Scrape menus

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '17 15 * * *'
  workflow_dispatch:
    inputs:
      days_to_scrape:
        description: Days to scrape, starting today (blank uses the DAYS_TO_SCRAPE variable)
        required: false

concurrency:
  group: scrape-menus
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    name: Scrape and upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @ut-dining/scraper...

      - name: Check secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_SERVICE_KEY repository secrets."
            exit 1
          fi

      - name: Scrape
        id: scrape
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ENABLE_SUPABASE: 'true'
          DAYS_TO_SCRAPE: ${{ inputs.days_to_scrape || vars.DAYS_TO_SCRAPE }}
          MENU_RETENTION_DAYS: ${{ vars.MENU_RETENTION_DAYS }}
          TZ: America/Chicago
        run: pnpm --filter @ut-dining/scraper start

      - name: Retry scrape after 10 minutes
        if: steps.scrape.outcome == 'failure'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ENABLE_SUPABASE: 'true'
          DAYS_TO_SCRAPE: ${{ inputs.days_to_scrape || vars.DAYS_TO_SCRAPE }}
          MENU_RETENTION_DAYS: ${{ vars.MENU_RETENTION_DAYS }}
          TZ: America/Chicago
        run: |
          sleep 600
          pnpm --filter @ut-dining/scraper start

      - name: Sync restaurants, cafés and food trucks
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ENABLE_SUPABASE: 'true'
          TZ: America/Chicago
        run: pnpm --filter @ut-dining/scraper places

      - name: Upload scraped JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: menus-${{ github.run_id }}
          path: apps/scraper/data/*.json
          retention-days: 7
          if-no-files-found: ignore

  keepalive:
    name: Keep schedule enabled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scraper.yml/enable"
